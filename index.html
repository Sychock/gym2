document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

gular,monospace;letter-spacing:-.04em}\n@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}\n@keyframes frameflip{0%,46%{opacity:0}54%,100%{opacity:1}}\n@keyframes restpulse{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.02);filter:brightness(1.25)}}\n<\u002Fstyle>\n<script src=\"53f48324-abd2-4b43-85bf-985ad94e616e\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div data-theme=\"{{ themeAttr }}\" data-mode=\"{{ modeAttr }}\" style=\"min-height:100dvh;display:flex;justify-content:center;background:var(--outer);color:var(--ink)\">\n<div style=\"width:100%;max-width:430px;position:relative;background:var(--bg);min-height:100dvh;padding-bottom:108px;overflow:hidden\">\n\n<sc-if value=\"{{ showProfiles }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeProfiles }}\" style=\"position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center\">\n<div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:430px;background:var(--bg);border-top:1px solid var(--hair);border-radius:14px 14px 0 0;padding:18px 16px 28px;animation:fadeup .2s ease\">\n<div style=\"font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--faint);font-family:'JetBrains Mono',ui-monospace,monospace;margin-bottom:12px\">ΠΡΟΦΙΛ<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<sc-for list=\"{{ profileRows }}\" as=\"p\" hint-placeholder-count=\"2\">\n<button sc-camel-on-click=\"{{ p.pick }}\" style=\"width:100%;border:1px solid {{ p.br }};background:{{ p.bg }};color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;min-height:56px\">\n<div style=\"width:36px;height:36px;flex:none;border-radius:8px;background:{{ p.avBg }};color:{{ p.avFg }};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800\">{{ p.initial }}<\u002Fdiv>\n<div style=\"flex:1;min-width:0\">\n<div style=\"font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fdiv>\n<div style=\"font-size:11px;font-weight:600;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.email }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:none;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--accentText);font-family:'JetBrains Mono',ui-monospace,monospace\">{{ p.tag }}<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<button sc-camel-on-click=\"{{ addProfileBtn }}\" style=\"width:100%;border:1px dashed var(--hair);background:none;color:var(--accentText);border-radius:10px;padding:14px;font-size:12px;font-weight:800;letter-spacing:.08em;cursor:pointer;min-height:48px\">+ ΝΕΟ ΠΡΟΦΙΛ<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;font-weight:500;color:var(--muted);margin-top:12px;line-height:1.6\">Κάθε προφίλ έχει δικά του κιλά, 1RM, καταγραφές, πρόγραμμα και ρυθμίσεις. Η αλλαγή δεν επηρεάζει το άλλο προφίλ.<\u002Fdiv>\n<button sc-camel-on-click=\"{{ doLogout }}\" style=\"margin-top:14px;border:0;background:none;color:var(--danger);font-size:11.5px;font-weight:800;letter-spacing:.06em;cursor:pointer;padding:6px 0;text-decoration:underline\">ΑΠΟΣΥΝΔΕΣΗ ΤΡΕΧΟΝΤΟΣ ΠΡΟΦΙΛ<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ needLogin }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:26px 22px;max-width:430px;margin:0 auto;overflow:auto\">\n<div style=\"font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--muted)\">METALLICADPA<\u002Fdiv>\n<div style=\"font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:10px\">ΣΥΝΔΕΣΗ<\u002Fdiv>\n<div style=\"font-size:13px;font-weight:500;color:var(--muted);margin-top:12px;line-height:1.6\">Email και κωδικός. Τα δεδομένα σου συγχρονίζονται σε όλες τις συσκευές.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;margin-top:22px\">\n<input type=\"email\" inputmode=\"email\" autocomplete=\"email\" value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ setLoginEmail }}\" placeholder=\"email@example.com\" style=\"width:100%;border:1px solid var(--hair);background:var(--panel);color:var(--ink);border-radius:8px;padding:14px;font-size:15px;font-weight:600;outline:none;min-height:50px\">\n<input type=\"password\" autocomplete=\"current-password\" value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ setLoginPass }}\" placeholder=\"κωδικός (6+ χαρακτήρες)\" style=\"width:100%;border:1px solid var(--hair);background:var(--panel);color:var(--ink);border-radius:8px;padding:14px;font-size:15px;font-weight:600;outline:none;min-height:50px\">\n<button sc-camel-on-click=\"{{ doLogin }}\" style=\"width:100%;border:0;background:var(--accent);color:var(--onAccent);border-radius:8px;padding:15px;font-size:13px;font-weight:800;letter-spacing:.08em;cursor:pointer;min-height:50px\">ΣΥΝΔΕΣΗ<\u002Fbutton>\n<button sc-camel-on-click=\"{{ doSignup }}\" style=\"width:100%;border:1px solid var(--hair);background:var(--panel);color:var(--ink);border-radius:8px;padding:15px;font-size:13px;font-weight:800;letter-spacing:.08em;cursor:pointer;min-height:50px\">ΔΗΜΙΟΥΡΓΙΑ ΛΟΓΑΡΙΑΣΜΟΥ<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:12px;font-weight:600;color:{{ authColor }};margin-top:12px;line-height:1.5;min-height:18px\">{{ authMsg }}<\u002Fdiv>\n<sc-for list=\"{{ savedAccounts }}\" as=\"a\" hint-placeholder-count=\"0\">\n<button sc-camel-on-click=\"{{ a.pick }}\" style=\"width:100%;border:1px solid var(--hair2);background:none;color:var(--muted);border-radius:8px;padding:12px 14px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left;margin-top:6px;min-height:44px\">{{ a.email }}<\u002Fbutton>\n<\u002Fsc-for>\n<sc-if value=\"{{ addProfile }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ cancelAdd }}\" style=\"border:0;background:none;color:var(--accentText);font-size:12px;font-weight:800;cursor:pointer;padding:14px 0 0;text-align:left;letter-spacing:.06em\">← ΠΙΣΩ ΣΤΟ ΤΡΕΧΟΝ ΠΡΟΦΙΛ<\u002Fbutton>\n<\u002Fsc-if>\n<button sc-camel-on-click=\"{{ goGuest }}\" style=\"border:0;background:none;color:var(--faint);font-size:12px;font-weight:600;cursor:pointer;padding:14px 0 0;text-align:left;text-decoration:underline\">Συνέχεια χωρίς λογαριασμό (μόνο σε αυτή τη συσκευή)<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"position:sticky;top:0;z-index:20;background:var(--headerBg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)\">\n<div style=\"display:flex;align-items:center;gap:8px;padding:11px 14px 9px\">\n<div style=\"width:7px;height:7px;flex:none;background:var(--accent);animation:blink 2.6s ease-in-out infinite\"><\u002Fdiv>\n<div style=\"flex:1;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--muted)\">METALLICADPA<\u002Fdiv>\n<div style=\"flex:none;font-size:9px;font-weight:700;letter-spacing:.1em;color:{{ syncColor }};font-family:'JetBrains Mono',ui-monospace,monospace\">{{ syncText }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ openProfiles }}\" style=\"flex:none;height:28px;max-width:96px;border:1px solid var(--accentDim);background:var(--panel);border-radius:8px;cursor:pointer;color:var(--accentText);padding:0 9px;font-size:10px;font-weight:800;letter-spacing:.08em;font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase\">{{ profileShort }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ prevWeek }}\" style=\"width:30px;height:28px;flex:none;border:1px solid var(--hair);background:var(--panel);border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center\" style-hover=\"color:var(--accent);border-color:var(--accentDim)\">\n<svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\"><path d=\"M10 3.5 5.5 8l4.5 4.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<div style=\"flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--ink);min-width:76px;text-align:center\">{{ weekLabel }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ nextWeek }}\" style=\"width:30px;height:28px;flex:none;border:1px solid var(--hair);background:var(--panel);border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center\" style-hover=\"color:var(--accent);border-color:var(--accentDim)\">\n<svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\"><path d=\"M6 3.5 10.5 8 6 12.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 12px 10px\">\n<sc-for list=\"{{ dayChips }}\" as=\"d\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ d.select }}\" style=\"border:1px solid {{ d.br }};background:{{ d.bg }};color:{{ d.fg }};border-radius:8px;padding:7px 4px 6px;cursor:pointer;text-align:center;min-height:44px\">\n<div style=\"font-size:9px;font-weight:700;letter-spacing:.12em;font-family:'JetBrains Mono',ui-monospace,monospace;opacity:.6\">{{ d.short }}<\u002Fdiv>\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-top:2px;color:{{ d.typeFg }}\">{{ d.type }}<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isWorkout }}\" hint-placeholder-val=\"{{ true }}\">\n<div styl ].planned += Number(it.sets) || 0;\n      mAgg[code].done += Number((d.log[it.id + \"|\" + week] || {}).sets) || 0;\n      mAgg[code].exs++;\n    }));\n    const mList = Object.keys(mAgg).map(k => mAgg[k]).sort((a, b) => b.planned - a.planned);\n    const mMax = mList.length ? Math.max.apply(null, mList.map(x => x.planned)) : 1;\n    const mTotal = mList.reduce((a, b) => a + b.planned, 0);\n    const mDoneTotal = mList.reduce((a, b) => a + b.done, 0);\n    const muscleRows = mList.map(x => {\n      const low = x.planned < 6, high = x.planned > 20;\n      return {\n        code: x.code, color: x.color, name: M_NAME[x.code] || x.code,\n        planned: x.planned, exs: x.exs,\n        setsText: x.done + \"/\" + x.planned,\n        barW: Math.round(x.planned / mMax * 100) + \"%\",\n        fillW: x.planned ? Math.round(Math.min(1, x.done / x.planned) * 100) + \"%\" : \"0%\",\n        status: low ? \"ΛΙΓΟ\" : high ? \"ΠΟΛΥ\" : \"ΟΚ\",\n        statusColor: low ? \"var(--amber)\" : high ? \"var(--danger)\" : \"var(--accentText)\"\n      };\n    });\n    const lowGroups = mList.filter(x => x.planned < 6).map(x => M_NAME[x.code] || x.code);\n\n    const names = Object.keys(d.rm).sort((a, b) => a.localeCompare(b, \"el\"));\n    const selName = s.sel || names[0];\n    const selItems = [];\n    d.routine.forEach(dd => dd.items.forEach(it => { if (it.ex === selName) selItems.push(it); }));\n    const hist = [];\n    for (let k = 1; k <= 12; k++) {\n      selItems.forEach(it => {\n        const lg = d.log[it.id + \"|\" + k];\n        if (lg && lg.reps !== undefined) {\n          const w = this.weightAt(it, k, d);\n          hist.push({ week: \"G\" + k, w: w, text: fmt(w) + \" kg × \" + lg.reps + \" reps\", badge: Number(lg.reps) >= it.max ? \"ΣΤΟΧΟΣ\" : \"—\", color: Number(lg.reps) >= it.max ? \"var(--accentText)\" : \"var(--faint)\" });\n        }\n      });\n    }\n    const ws = hist.map(h => h.w);\n    const lo = ws.length ? Math.min.apply(null, ws) : 0;\n    const hi = ws.length ? Math.max.apply(null, ws) : 1;\n    const span = hi - lo || 1;\n    const dots = hist.map((h, i) => {\n      const x = hist.length === 1 ? 160 : 10 + i * (300 / Math.max(1, hist.length - 1));\n      const y = 106 - ((h.w - lo) / span) * 90;\n      return { x: Math.round(x), y: Math.round(y), rx: Math.round(x) - 3, ry: Math.round(y) - 3 };\n    });\n    const estSel = selItems.length ? this.estimate(selItems[0], d) : 0;\n    const nowW = selItems.length ? this.weightAt(selItems[0], week, d) : 0;\n\n    const inputRows = names.map(n => ({\n      name: n, rm: d.rm[n], rate: d.rate[n] || 0,\n      rateColor: (d.rate[n] || 0) > 0 ? \"var(--accentText)\" : \"var(--faint)\",\n      setRm: e => { const v = e.target.value; this.patch(x => { x.rm[n] = v === \"\" ? 0 : Number(v); }); },\n      setRate: e => { const v = e.target.value; this.patch(x => { x.rate[n] = v === \"\" ? 0 : Number(v); }); }\n    }));\n\n    const editRows = day.items.map((it, i, arr) => ({\n      name: it.ex, sets: it.sets, min: it.min, max: it.max,\n      setSets: e => { const v = Number(e.target.value) || 1; this.patch(x => { x.routine[s.day].items[i].sets = v; }); },\n      setMin: e => { const v = Number(e.target.value) || 1; this.patch(x => { x.routine[s.day].items[i].min = v; }); },\n      setMax: e => { const v = Number(e.target.value) || 1; this.patch(x => { x.routine[s.day].items[i].max = v; }); },\n      remove: () => this.patch(x => { x.routine[s.day].items.splice(i, 1); }),\n      up: () => { if (i > 0) this.patch(x => { const a = x.routine[s.day].items; a.splice(i - 1, 0, a.splice(i, 1)[0]); }); },\n      down: () => this.patch(x => { const a = x.routine[s.day].items; if (i < a.length - 1) a.splice(i + 1, 0, a.splice(i, 1)[0]); }),\n      upFg: i === 0 ? \"var(--faint)\" : \"var(--muted)\",\n      downFg: i === arr.length - 1 ? \"var(--faint)\" : \"var(--muted)\"\n    }));\n\n    const calcMult = RM_MULT[Math.max(1, Math.min(12, Math.round(Number(s.calcR) || 1)))] / 100;\n    const calc1rm = Math.floor((Number(s.calcW) || 0) / calcMult / r) * r;\n    const seg = (on) => ({ bg: on ? \"var(--accent)\" : \"transparent\", fg: on ? \"var(--onAccent)\" : \"var(--muted)\", br: on ? \"var(--accent)\" : \"var(--hair)\" });\n    const r25 = seg(r === 2.5), r5 = seg(r === 5);\n    const t60 = seg(d.restSec === 60), t90 = seg(d.restSec === 90), t120 = seg(d.restSec === 120), t180 = seg(d.restSec === 180);\n\n    const tab = t => () => this.setState({ tab: t });\n    const navItems = [\n      { label: \"ΠΡΟΠΟΝΗΣΗ\", icon: \"M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11\", t: \"workout\" },\n      { label: \"ΠΛΑΝΟ\", icon: \"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z\", t: \"grid\" },\n      { label: \"ΠΡΟΟΔΟΣ\", icon: \"M4 19h16M5 15l4.5-5 4 3L19 6\", t: \"progress\" },\n      { label: \"ΡΥΘΜΙΣΕΙΣ\", icon: \"M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4\", t: \"settings\" }\n    ].map(n => ({ label: n.label, icon: n.icon, go: tab(n.t), mark: s.tab === n.t ? \"var(--accent)\" : \"transparent\", color: s.tab === n.t ? \"var(--ink)\" : \"var(--faint)\" }));\n\n    return Object.assign(this.authVals(), {\n      themeAttr: d.theme === \"light\" ? \"light\" : \"dark\",\n      modeAttr: String(day.type || \"rest\").toLowerCase().replace(/[^a-z]/g, \"\") || \"rest\",\n      isWorkout: s.tab === \"workout\", isGrid: s.tab === \"grid\", isProgress: s.tab === \"progress\", isSettings: s.tab === \"settings\",\n      weekLabel: \"ΓΥΡΟΣ \" + week + \"/12\",\n      prevWeek: () => { this.navTouched = true; this.setState({ week: Math.max(1, week - 1) }); },\n      nextWeek: () => { this.navTouched = true; this.setState({ week: Math.min(12, week + 1) }); },\n      dayName: day.name, dayType: day.type, dayChips: dayChips, showEst: showEst,\n      dayExCount: day.items.length, setBlocks: setBlocks,\n      dayVolume: volume >= 1000 ? Math.round(volume / 100) / 10 + \"t\" : Math.round(volume) + \"\",\n      dayDoneText: totalSets ? doneSets + \"/\" + totalSets + \" ΣΕΤ\" : \"—\",\n      daySetsText: totalSets ? doneSets + \"/\" + totalSets : \"—\",\n      isRestDay: day.items.length === 0,\n      exercises: exercises,\n      dayComplete: dayComplete, dayPrs: String(dayPrs),\n      sessionClock: ses.start ? fmtDur(durMs) : \"—\",\n      clockColor: ses.start && !ses.end ? \"var(--accentText)\" : \"var(--ink)\",\n      nextLabel: nextLabel,\n      goNext: () => { this.navTouched = true; this.setState({ week: nxt.week, day: nxt.day, tab: \"workout\" }); try { window.scrollTo(0, 0); } catch (e) {} },\n      volBars: volBars, volMaxText: vMax > 1 ? \"MAX \" + (vMax >= 1000 ? fmt(vMax / 1000) + \"t\" : Math.round(vMax) + \" kg\") : \"\",\n      sumSessions: String(sumSessions), sumSets: String(sumSets), sumPrs: String(prInfo.list.length),\n      prList: prList, noPrs: prList.length === 0,\n      restPct: s.restTotal ? Math.round(s.rest / s.restTotal * 100) + \"%\" : \"0%\",\n      restLabel: firstOpen >= 0 ? \"ΕΠΟΜΕΝΟ · \" + day.items[firstOpen].ex : \"ΞΕΚΟΥΡΑΣΗ\",\n      weekHeads: Array.from({ length: 12 }, (_, i) => ({ label: \"G\" + (i + 1), color: i + 1 === week ? \"var(--accent)\" : \"var(--faint)\" })),\n      gridRows: gridRows,\n      exOptions: names.map(n => ({ v: n, label: n })),\n      selEx: selName, pickEx: e => this.setState({ sel: e.target.value }),\n      pNow: nowW ? fmt(nowW) : \"—\",\n      pEst: estSel ? fmt(Math.floor(estSel / r) * r) : \"—\",\n      pSessions: hist.length,\n      chartPoints: dots.map(p => p.x + \",\" + p.y).join(\" \"),\n      chartDots: dots,\n      chartCaption: hist.length ? \"ΚΙΛΑ ΑΝΑ ΓΥΡΟ · \" + fmt(lo) + \"–\" + fmt(hi) + \" KG\" : \"ΚΑΤΑΓΡΑΨΕ REPS ΓΙΑ ΝΑ ΧΤΙΣΤΕΙ Η ΚΑΜΠΥΛΗ\",\n      history: hist.slice().reverse(), noHistory: hist.length === 0,\n      muscleRows: muscleRows, noMuscle: muscleRows.length === 0,\n      mCycleLabel: \"ΓΥΡΟΣ \" + week, mTotalText: mDoneTotal + \"/\" + mTotal,\n      mHint: lowGroups.length ? \"Κάτω από 6 σετ ανά γύρο: \" + lowGroups.join(\" · \") + \". Σκέψου +1 άσκηση ή +1 σετ εκεί.\" : \"Ισορροπημένη κατανομή — καμία ομάδα κάτω από 6 σετ ανά γύρο.\",\n      mHintColor: lowGroups.length ? \"var(--amber)\" : \"var(--accentText)\",\n      inputRows: inputRows, editRows: editRows,\n      addPick: s.addPick, setAddPick: e => this.setState({ addPick: e.target.value }),\n      addToDay: () => this.patch(x => { x.routine[s.day].items.push({ id: \"r\" + x.uid, ex: s.addPick || names[0], sets: 3, min: 8, max: 12 }); x.uid = (x.uid || 1) + 1; }),\n      roundingText: fmt(r),\n      r25bg: r25.bg, r25fg: r25.fg, r25br: r25.br, r5bg: r5.bg, r5fg: r5.fg, r5br: r5.br,\n      setRound25: () => this.patch(x => { x.rounding = 2.5; }),\n      setRound5: () => this.patch(x => { x.rounding = 5; }),\n      t60bg: t60.bg, t60fg: t60.fg, t60br: t60.br, t90bg: t90.bg, t90fg: t90.fg, t90br: t90.br,\n      t120bg: t120.bg, t120fg: t120.fg, t120br: t120.br, t180bg: t180.bg, t180fg: t180.fg, t180br: t180.br,\n      rest60: () => this.patch(x => { x.restSec = 60; }), rest90: () => this.patch(x => { x.restSec = 90; }),\n      rest120: () => this.patch(x => { x.restSec = 120; }), rest180: () => this.patch(x => { x.restSec = 180; }),\n      restBaseText: Math.floor((d.restSec || 90) / 60) + \":\" + String((d.restSec || 90) % 60).padStart(2, \"0\"),\n      restRows: this.restRows(d),\n      themeLabel: d.theme === \"light\" ? \"LIGHT\" : \"DARK\",\n      toggleTheme: () => this.patch(x => { x.theme = x.theme === \"light\" ? \"dark\" : \"light\"; }),\n      calcW: s.calcW, calcR: s.calcR,\n      setCalcW: e => this.setState({ calcW: e.target.value }),\n      setCalcR: e => this.setState({ calcR: e.target.value }),\n      calcOut: calc1rm ? fmt(calc1rm) : \"—\",\n      restActive: s.rest > 0 && s.tab === \"workout\",\n      restText: Math.floor(s.rest / 60) + \":\" + String(s.rest % 60).padStart(2, \"0\"),\n      addRest: () => this.setRest(s.rest + 30),\n      stopRest: () => this.setRest(0),\n      restDone: !!s.restDone && s.tab === \"workout\",\n      clearDone: () => this.setState({ restDone: false }),\n      navItems: navItems,\n      exportCsv: () => {\n        const rows = [[\"Ημέρα\", \"Τύπος\", \"Άσκηση\", \"Γύρος\", \"Κιλά\", \"Σετ στόχος\", \"Σετ ok\", \"Min reps\", \"Max reps\", \"Reps τελ. σετ\", \"Reps ανά σετ\", \"Στόχος\", \"Ημερομηνία\"]];\n        d.routine.forEach(dd => dd.items.forEach(it => {\n          for (let k = 1; k <= 12; k++) {\n            const lg = d.log[it.id + \"|\" + k];\n            if (!lg) continue;\n            rows.push([dd.name, dd.type, it.ex, k, fmt(this.weightAt(it, k, d)), it.sets, lg.sets || 0, it.min, it.max, lg.reps === undefined ? \"\" : lg.reps, setsArr(lg).map(v => v == null ? \"\" : v).join(\"/\"), lg.reps !== undefined && Number(lg.reps) >= it.max ? \"ΝΑΙ\" : \"ΟΧΙ\", lg.date || \"\"]);\n          }\n        }));\n        this.download(\"gym-workouts.csv\", rows.map(x => x.join(\";\")).join(\"\\n\"));\n      },\n      exportInputs: () => {\n        const rows = [[\"Άσκηση\", \"1RM\", \"Progression rate\", \"Κιλά ανά βαθμίδα\"]];\n        names.forEach(n => rows.push([n, d.rm[n], d.rate[n] || 0, fmt((d.rate[n] || 0) * r)]));\n        this.download(\"gym-1rm.csv\", rows.map(x => x.join(\";\")).join(\"\\n\"));\n      },\n      newCycle: () => {\n        if (!confirm(\"Νέος κύκλος: τα εκτιμώμενα 1RM γίνονται τα νέα 1RM και σβήνονται οι καταγραφές. Συνέχεια;\")) return;\n        this.patch(x => {\n          const upd = {};\n          x.routine.forEach(dd => dd.items.forEach(it => {\n            const est = this.estimate(it, d);\n            if (est) upd[it.ex] = Math.max(upd[it.ex] || 0, Math.floor(est / r) * r);\n          }));\n          Object.keys(upd).forEach(n => { x.rm[n] = upd[n]; });\n          x.log = {}; x.sessions = {};\n        });\n        this.setState({ week: 1, day: 0 });\n      }\n    });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
